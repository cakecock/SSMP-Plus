name: Build SSMP Plus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f "ssmp-release.jks" ]; then
          echo "Generating permanent keystore..."
          keytool -genkeypair -v \
            -keystore ssmp-release.jks \
            -alias ssmp_plus_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SSMP_Brest_2026_Secure" \
            -keypass "SSMP_Brest_2026_Secure" \
            -dname "CN=SSMP Plus, OU=103 Brest, O=SSMP, L=Brest, C=BY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssmp-release.jks
          git commit -m "chore: save permanent keystore [skip ci]" || true
          git push || true
        else
          echo "Permanent keystore already exists."
        fi

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Signed APK
      run: gradle assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SSMP-Plus-Signed-APK
        path: app/build/outputs/apk/release/*.apk
