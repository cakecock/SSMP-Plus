name: Build and Release SSMP Plus

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f "ssmp-release.jks" ]; then
          echo "Generating permanent keystore..."
          keytool -genkeypair -v \
            -keystore ssmp-release.jks \
            -alias ssmp_plus_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SSMP_Brest_2026_Secure" \
            -keypass "SSMP_Brest_2026_Secure" \
            -dname "CN=SSMP Plus, OU=103 Brest, O=SSMP, L=Brest, C=BY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssmp-release.jks
          git commit -m "chore: save permanent keystore [skip ci]" || true
          git push || true
        fi

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Signed APK with Auto-Version
      run: |
        gradle assembleRelease \
          -PappVersionCode=${{ github.run_number }} \
          -PappVersionName=1.0.${{ github.run_number }} \
          --no-daemon

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/release/*.apk SSMP-Plus-v1.0.${{ github.run_number }}.apk

    - name: Publish to GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v1.0.${{ github.run_number }} \
          SSMP-Plus-v1.0.${{ github.run_number }}.apk \
          --title "SSMP Plus v1.0.${{ github.run_number }}" \
          --notes "### Обновление SSMP Plus
          - **Версия:** 1.0.${{ github.run_number }} (сборка #${{ github.run_number }})
          - Прямая установка APK без архивов.
          - Автосохранение, интеллектуальное автозаполнение и локальный архив."
