- name: Publish Android APK and iOS Extension to GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v1.0.${{ github.run_number }} \
          SSMP-Plus-v1.0.${{ github.run_number }}.apk \
          ios/SSMP-Plus-iOS.user.js \
          --title "SSMP Plus v1.0.${{ github.run_number }} (Android + iOS)" \
          --notes "### Обновление SSMP Plus v1.0.${{ github.run_number }}
          - 📱 **Android:** Скачайте и установите \`SSMP-Plus-v1.0.${{ github.run_number }}.apk\`
          - 🍏 **iOS (iPhone / Safari):** Установите бесплатное приложение **Stay** или **Userscripts** из App Store и импортируйте файл \`SSMP-Plus-iOS.user.js\`"
