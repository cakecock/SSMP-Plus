name: Get signing fingerprint

on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Print SHA256
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v -keystore ssmp-release.jks \
            -alias "$ALIAS" -storepass "$PASS" -keypass "$PASS" \
            | grep -i 'SHA256:' | head -1
