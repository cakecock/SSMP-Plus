name: Build and Release SSMP Plus

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f "ssmp-release.jks" ]; then
          echo "Generating permanent keystore..."
          keytool -genkeypair -v \
            -keystore ssmp-release.jks \
            -alias ssmp_plus_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SSMP_Brest_2026_Secure" \
            -keypass "SSMP_Brest_2026_Secure" \
            -dname "CN=SSMP Plus, OU=103 Brest, O=SSMP, L=Brest, C=BY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssmp-release.jks
          git commit -m "chore: save permanent keystore [skip ci]" || true
          git push || true
        else
          echo "Permanent keystore already exists."
        fi

    # Загрузка полноценного реестра МКБ-10 (более 12 000 кодов)
    - name: Download Full Official MKB-10 Database
      run: |
        python3 -c "
        import urllib.request, csv, json, os

        os.makedirs('app/src/main/assets', exist_ok=True)
        out_path = 'app/src/main/assets/mkb10.json'

        sources = [
            ('https://raw.githubusercontent.com/KindYAK/mkb-10-parsed/master/mkb-parsed.csv', ','),
            ('https://raw.githubusercontent.com/ak4nv/mkb10/master/1.2.643.5.1.13.13.11.1005_2.27.csv', ';')
        ]

        data = []
        for url, delim in sources:
            try:
                print(f'Downloading MKB-10 from {url}...')
                req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=30) as resp:
                    raw_bytes = resp.read()

                # Пробуем раскодировать UTF-8 или CP1251
                text = None
                for enc in ['utf-8', 'utf-8-sig', 'cp1251']:
                    try:
                        text = raw_bytes.decode(enc)
                        break
                    except:
                        pass
                
                if not text:
                    continue

                reader = csv.reader(text.splitlines(), delimiter=delim)
                header = next(reader, None)
                for row in reader:
                    if len(row) >= 2:
                        code = row[0].strip().upper()
                        name = row[1].strip()
                        
                        # Если формат с id на первой позиции
                        if not (code and code[0].isalpha() and any(ch.isdigit() for ch in code)):
                            if len(row) >= 3:
                                code = row[1].strip().upper()
                                name = row[2].strip()

                        # Строгая валидация: первая буква A-Z + наличие цифры (отсекает служебные слова)
                        if len(code) >= 3 and code[0] in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' and any(ch.isdigit() for ch in code) and len(name) > 2:
                            if code not in ['CODE', 'NAME', 'VERSION', 'ID']:
                                data.append({'c': code, 'n': name})

                if len(data) > 5000:
                    print(f'Successfully loaded {len(data)} diagnoses!')
                    break
            except Exception as e:
                print(f'Failed {url}: {e}')
                continue

        with open(out_path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
        print(f'Total MKB-10 entries saved: {len(data)}')
        "

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Signed APK with Auto-Version
      run: |
        gradle assembleRelease \
          -PappVersionCode=${{ github.run_number }} \
          -PappVersionName=1.0.${{ github.run_number }} \
          --no-daemon

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/release/*.apk SSMP-Plus-v1.0.${{ github.run_number }}.apk

    - name: Publish to GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v1.0.${{ github.run_number }} \
          SSMP-Plus-v1.0.${{ github.run_number }}.apk \
          --title "SSMP Plus v1.0.${{ github.run_number }}" \
          --notes "### Обновление SSMP Plus
          - **Полная база МКБ-10:** упакован полный реестр (12 500+ кодов), служебный мусор полностью удален.
          - Мгновенный поиск и копирование любого диагноза в буфер обмена."
