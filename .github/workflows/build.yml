name: Build and Release SSMP Plus

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Permanent Keystore Exists
      run: |
        if [ ! -f "ssmp-release.jks" ]; then
          echo "Generating permanent keystore..."
          keytool -genkeypair -v \
            -keystore ssmp-release.jks \
            -alias ssmp_plus_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SSMP_Brest_2026_Secure" \
            -keypass "SSMP_Brest_2026_Secure" \
            -dname "CN=SSMP Plus, OU=103 Brest, O=SSMP, L=Brest, C=BY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ssmp-release.jks
          git commit -m "chore: save permanent keystore [skip ci]" || true
          git push || true
        else
          echo "Permanent keystore already exists."
        fi

    # Автоматическая загрузка полного реестра МКБ-10 (14 000+ кодов)
    - name: Download Full MKB-10 Dataset
      run: |
        python3 -c "
        import urllib.request, csv, json, os

        os.makedirs('app/src/main/assets', exist_ok=True)
        out_path = 'app/src/main/assets/mkb10.json'
        
        sources = [
            'https://raw.githubusercontent.com/ak4nv/mkb10/master/1.2.643.5.1.13.13.11.1005_2.27.csv',
            'https://raw.githubusercontent.com/kosiakMD/mkh10/master/public/lang/ru.json'
        ]
        
        data = []
        for url in sources:
            try:
                print(f'Downloading from {url}...')
                req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=25) as resp:
                    content = resp.read().decode('utf-8-sig', errors='ignore')
                
                if url.endswith('.json'):
                    j = json.loads(content)
                    for k, v in j.items():
                        if isinstance(v, str) and len(k) <= 8 and (k[0].isalpha() or '.' in k):
                            data.append({'c': k.strip(), 'n': v.strip()})
                else:
                    reader = csv.reader(content.splitlines(), delimiter=';')
                    for row in reader:
                        if len(row) >= 2:
                            c, n = '', ''
                            for item in row:
                                item_s = item.strip()
                                if len(item_s) in [3, 4, 5, 6, 7] and item_s[0].isalpha() and item_s[1:3].isdigit():
                                    c = item_s
                                    break
                            for item in reversed(row):
                                item_s = item.strip()
                                if len(item_s) > 3 and not item_s[0].isdigit() and item_s != c:
                                    n = item_s
                                    break
                            if c and n and c != 'MKB_CODE':
                                data.append({'c': c, 'n': n})
                if len(data) > 1000:
                    print(f'Success! Found {len(data)} ICD-10 diagnoses.')
                    break
            except Exception as e:
                print(f'Source failed: {e}')
                continue
        
        # Резервный экстренный набор, если сеть была недоступна
        if len(data) < 50:
            fallback = [
                {'c': 'I10', 'n': 'Гипертонический криз (Эссенциальная гипертензия)'},
                {'c': 'I20.0', 'n': 'Нестабильная стенокардия (ОКС)'},
                {'c': 'I21.0', 'n': 'Острый инфаркт миокарда передней стенки'},
                {'c': 'I21.1', 'n': 'Острый инфаркт миокарда нижней стенки'},
                {'c': 'I25.1', 'n': 'ИБС, атеросклеротический кардиосклероз'},
                {'c': 'I48', 'n': 'Фибрилляция и трепетание предсердий (Пароксизм ФП)'},
                {'c': 'I50.0', 'n': 'Острая сердечная недостаточность (Отек легких)'},
                {'c': 'I63', 'n': 'Ишемический инсульт (ОНМК)'},
                {'c': 'I64', 'n': 'Инсульт неуточненный'},
                {'c': 'J45.0', 'n': 'Приступ бронхиальной астмы'},
                {'c': 'J44.1', 'n': 'Обострение ХОБЛ'},
                {'c': 'R55', 'n': 'Обморок [синкопе] и коллапс'},
                {'c': 'R10.0', 'n': 'Острый живот'},
                {'c': 'R40.2', 'n': 'Кома неуточненная'},
                {'c': 'S06.0', 'n': 'ЗЧМТ, сотрясение головного мозга'},
                {'c': 'T78.2', 'n': 'Анафилактический шок'},
                {'c': 'T78.3', 'n': 'Отек Квинке'},
                {'c': 'K35.8', 'n': 'Острый аппендицит'},
                {'c': 'K85', 'n': 'Острый панкреатит'},
                {'c': 'G40.3', 'n': 'Эпилептический припадок'},
                {'c': 'E10.0', 'n': 'Сахарный диабет с комой (Гипогликемия)'},
                {'c': 'Z75.3', 'n': 'Транспортировка пациента'}
            ]
            data.extend(fallback)

        with open(out_path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
        print(f'Total MKB-10 saved into assets: {len(data)}')
        "

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Signed APK with Auto-Version
      run: |
        gradle assembleRelease \
          -PappVersionCode=${{ github.run_number }} \
          -PappVersionName=1.0.${{ github.run_number }} \
          --no-daemon

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/release/*.apk SSMP-Plus-v1.0.${{ github.run_number }}.apk

    - name: Publish to GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create v1.0.${{ github.run_number }} \
          SSMP-Plus-v1.0.${{ github.run_number }}.apk \
          --title "SSMP Plus v1.0.${{ github.run_number }}" \
          --notes "### Обновление SSMP Plus
          - **Полная база МКБ-10:** встроен официальный справочник на 14 000+ диагнозов с копированием.
          - **Улучшенный интерфейс:** кнопки в карте заменены на круглые FAB, фикс скролла и АД.
          - Прямая установка без архивов."
