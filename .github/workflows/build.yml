name: Build and Release SSMP Plus

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

        - name: Restore release keystore from secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "❌ Секрет KEYSTORE_BASE64 не задан"
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > ssmp-release.jks
        test -s ssmp-release.jks && echo "✅ Ключ восстановлен из Secrets"

    - name: Verify signing key fingerprint
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        EXPECTED_SHA256: ${{ secrets.KEYSTORE_SHA256 }}
      run: |
        EXPECTED=$(printf '%s' "$EXPECTED_SHA256" \
          | sed 's/^SHA256:[[:space:]]*//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
        ACTUAL=$(keytool -list -v -keystore ssmp-release.jks -alias "$KEY_ALIAS" \
          -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
          | grep -i 'SHA256:' | head -1 | awk '{print $2}' \
          | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
        echo "Ожидаемый SHA256: $EXPECTED"
        echo "Фактический SHA256: $ACTUAL"
        [ "$ACTUAL" = "$EXPECTED" ] || { echo "❌ Ключ не совпадает с рабочим — сборка остановлена"; exit 1; }
        echo "✅ Подпись совпадает с рабочим ключом"

    # Загрузка полноценного реестра МКБ-10 (более 12 000 кодов)
    - name: Download Full Official MKB-10 Database
      run: |
        python3 -c "
        import urllib.request, csv, json, os

        os.makedirs('app/src/main/assets', exist_ok=True)
        out_path = 'app/src/main/assets/mkb10.json'

        sources = [
            ('https://raw.githubusercontent.com/KindYAK/mkb-10-parsed/master/mkb-parsed.csv', ','),
            ('https://raw.githubusercontent.com/ak4nv/mkb10/master/1.2.643.5.1.13.13.11.1005_2.27.csv', ';')
        ]

        data = []
        for url, delim in sources:
            try:
                print(f'Downloading MKB-10 from {url}...')
                req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                with urllib.request.urlopen(req, timeout=30) as resp:
                    raw_bytes = resp.read()

                text = None
                for enc in ['utf-8', 'utf-8-sig', 'cp1251']:
                    try:
                        text = raw_bytes.decode(enc)
                        break
                    except:
                        pass
                
                if not text:
                    continue

                reader = csv.reader(text.splitlines(), delimiter=delim)
                header = next(reader, None)
                for row in reader:
                    if len(row) >= 2:
                        code = row[0].strip().upper()
                        name = row[1].strip()
                        
                        if not (code and code[0].isalpha() and any(ch.isdigit() for ch in code)):
                            if len(row) >= 3:
                                code = row[1].strip().upper()
                                name = row[2].strip()

                        if len(code) >= 3 and code[0] in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' and any(ch.isdigit() for ch in code) and len(name) > 2:
                            if code not in ['CODE', 'NAME', 'VERSION', 'ID']:
                                data.append({'c': code, 'n': name})

                if len(data) > 5000:
                    print(f'Successfully loaded {len(data)} diagnoses!')
                    break
            except Exception as e:
                print(f'Failed {url}: {e}')
                continue

        with open(out_path, 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False)
        print(f'Total MKB-10 entries saved: {len(data)}')
        "

    # Проверка целостности базы МКБ-10: мало просто наличие файла — проверяем JSON и число записей
    - name: Verify MKB-10 Database Integrity
      run: |
        python3 -c "
        import json
        p = 'app/src/main/assets/mkb10.json'
        with open(p, encoding='utf-8') as f:
            data = json.load(f)
        if not isinstance(data, list) or len(data) < 5000:
            raise SystemExit('❌ Ошибка: MKB-10 повреждён или содержит менее 5000 записей. Сборка остановлена.')
        bad = [x for x in data[:100] if not isinstance(x, dict) or not x.get('c') or not x.get('n')]
        if bad:
            raise SystemExit('❌ Ошибка: неверная структура записей MKB-10. Сборка остановлена.')
        print(f'✅ МКБ-10: {len(data)} записей, JSON корректен')
        "

    # Автообновление iOS работает только если в userscript есть @version
    - name: Verify iOS userscript auto-update metadata
      run: |
        if [ -f "ios/SSMP-Plus-iOS.user.js" ]; then
          if ! grep -q '^// @version' ios/SSMP-Plus-iOS.user.js; then
            echo "❌ В iOS userscript отсутствует @version — автообновление не работает."
            exit 1
          fi
          echo "✅ iOS @version: $(grep '^// @version' ios/SSMP-Plus-iOS.user.js | head -1 | awk '{print $3}')"
        fi

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

        - name: Build Signed APK with Auto-Version
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        gradle assembleRelease \
          -PappVersionCode=${{ github.run_number }} \
          -PappVersionName=3.10.${{ github.run_number }} \
          --no-daemon

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/release/*.apk SSMP-Plus-v3.10.${{ github.run_number }}.apk

    # Автоматическая очистка всех старых релизов и тегов
    - name: Cleanup Old Releases and Tags
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Cleaning up old releases..."
        gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r old_tag; do
          if [ -n "$old_tag" ]; then
            echo "Deleting old release and tag: $old_tag"
            gh release delete "$old_tag" --cleanup-tag --yes || true
          fi
        done

    - name: Publish Android APK and iOS Extension to GitHub Releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f "ios/SSMP-Plus-iOS.user.js" ]; then
          gh release create v3.10.${{ github.run_number }} \
            SSMP-Plus-v3.10.${{ github.run_number }}.apk \
            ios/SSMP-Plus-iOS.user.js \
            --title "SSMP Plus v3.10.${{ github.run_number }} (Android + iOS)" \
            --notes "### 🚑 SSMP Plus v3.10.${{ github.run_number }}
            - 📱 **Android:** скачайте \`SSMP-Plus-v3.10.${{ github.run_number }}.apk\` (проверка обновлений доступна прямо в меню приложения)
            - 🍏 **iOS:** браузер **Orion** + **Violentmonkey** (или **Stay** / **Userscripts**) — установите \`SSMP-Plus-iOS.user.js\` (поддержка автообновлений по raw-ссылке)
            - ⚡ **Автопилот карт и препаратов:** бесшовное заполнение с защитой вкладки «Заключение», живой серверный поиск препаратов и исправленная вставка наборов в новых картах
            - 📌 **Шаблоны и архив:** 63 эталонных шаблона, полный редактор «Свои шаблоны» (все кнопки/списки карты + МКБ-10 с сайта) и архив вызовов (Импорт/Экспорт JSON)
            - 📚 **Каталог МЗ РБ:** 401 клинический протокол с поиском и фильтрами; на Android PDF открывается прямо в приложении (кнопка «Внешний» тоже есть), на iOS — системным вьюером
            - 📷 **Камера/фото ЭКГ:** исправлена загрузка фото через системную камеру, без лишнего запроса разрешения
            - 📜 **ТЛТ и приказы:** 18 карточек по актуальным документам (№44/2026, №1/2026, №38/2026, №179/2025, №99, №126, №64, педиатрия и психиатрия), фильтры по разделам и кнопка «PDF протокола» в каждой карточке
            - 🧰 **Помощник СМП (13 модулей):** аудит карты, ЭКГ, СЛР-таймер, фразы, МКБ-10, педиатрия (Пост. №118), шкалы, калькуляторы, акушерство, яды/антидоты, лекарства, ТЛТ/приказы и каталог протоколов МЗ РБ"
        else
          gh release create v3.10.${{ github.run_number }} \
            SSMP-Plus-v3.10.${{ github.run_number }}.apk \
            --title "SSMP Plus v3.10.${{ github.run_number }}" \
            --notes "### 🚑 SSMP Plus v3.10.${{ github.run_number }}
            - Полный редактор «Свои шаблоны», исправленный автопилот препаратов, проверка обновлений APK, 63 образца СМП, 13 модулей Помощника, 18 карточек ТЛТ/приказов и каталог 401 протокола МЗ РБ."
        fi
